<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>AquaDesk</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <h1>AquaDesk</h1><p>Aquacool call assistance</p>
  <p id="status" role="status"></p>
  <form id="login">
    <label for="email">Work email</label><input id="email" type="email" autocomplete="username" required>
    <label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required>
    <button id="submit" type="submit">Sign In</button>
  </form>
  <button id="logout" type="button" hidden>Sign Out</button>
  <script src="auth.js"></script><script src="popup.js"></script>
</body>
</html>
